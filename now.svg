<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Currently training phi-3-mini with QLoRA, shipping phi3-pr-reviewer, studying fine-tuning versus RAG." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 18px; }
    .k { fill: #6F7F96; }
    .v { fill: #E4ECF6; }
    .p { fill: #FFB454; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090D"/>
      <stop offset="1" stop-color="#0C1119"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6F7F96"/>
      <stop offset="1" stop-color="#FFB454"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="229" rx="14" fill="url(#bg)" stroke="#1B2433"/>
  <text x="32" y="44" class="m k" font-size="14">~/lab</text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <text x="32" y="86" class="m"><tspan class="p">$</tspan><tspan class="v"> cat now.txt</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
    <text x="32" y="122" class="m"><tspan class="k">training  </tspan><tspan class="v">phi-3-mini, QLoRA, on pull request reviews</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
    <text x="32" y="152" class="m"><tspan class="k">shipping  </tspan><tspan class="v">phi3-pr-reviewer</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.1s" fill="freeze"/>
    <text x="32" y="182" class="m"><tspan class="k">studying  </tspan><tspan class="v">fine-tuning versus RAG</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.7s" fill="freeze"/>
    <text x="32" y="212" class="m k" font-size="14">loop</text>
    <rect x="90" y="203" width="320" height="4" rx="2" fill="#151C28"/>
    <rect x="90" y="203" width="0" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.7;0.9;1" values="0;320;320;0"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
